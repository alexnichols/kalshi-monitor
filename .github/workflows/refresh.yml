name: Refresh Kalshi data

on:
  schedule:
    - cron: "20 0 * * *"        # 00:20 UTC daily, after the UTC day closes
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill from this date (YYYY-MM-DD), e.g. 2025-01-01. Leave blank for a normal refresh."
        required: false
        default: ""

permissions:
  contents: write                # commit data.json and the day cache
  actions: write                 # re-dispatch itself while a backfill is unfinished

concurrency:
  group: kalshi-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # GitHub-hosted jobs stop at 6 h; the pipeline saves progress at 5.5 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Run pipeline
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          if [ -n "$START" ] && ! [[ "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "start must look like 2025-01-01"; exit 1
          fi
          python kalshi_pipeline.py \
            --cache data/cache --out docs/data.json \
            --max-minutes 330 --rps 12 \
            ${START:+--start "$START"}

      - name: Commit data
        if: always()             # keep partial backfill progress even if the pipeline errors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%F)"
          git pull --rebase --autostash && git push

      - name: Continue backfill if unfinished
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys; s=json.load(open('data/cache/status.json')); sys.exit(0 if s.get('stopped_early') else 1)"; then
            echo "Backfill unfinished; starting the next run."
            gh workflow run refresh.yml --ref "${{ github.ref_name }}"
          fi
