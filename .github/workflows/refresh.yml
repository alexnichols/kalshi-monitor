name: Refresh Kalshi data

on:
  schedule:
    - cron: "20 9 * * *"        # 09:20 UTC: Kalshi publishes each Eastern-time day's trade report the next day
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill from this date (YYYY-MM-DD), e.g. 2025-01-01. Leave blank for a normal refresh."
        required: false
        default: ""

permissions:
  contents: write                # commit data.json and the day cache
  actions: write                 # re-dispatch itself while a backfill is unfinished

concurrency:
  group: kalshi-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 140         # each run stops new work at ~105 min, saves, then starts the next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Run pipeline
        id: pipeline
        timeout-minutes: 125     # safety net; the commit step below still runs if this trips
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          if [ -n "$START" ] && ! [[ "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "start must look like 2025-01-01"; exit 1
          fi
          python kalshi_pipeline.py \
            --cache data/cache --out docs/data.json \
            --max-minutes 105 --rps 4 --workers 3 \
            ${START:+--start "$START"}

      - name: Commit data
        if: always()             # keep partial backfill progress even if the pipeline errors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%F)"
          git pull --rebase --autostash && git push

      - name: Continue backfill if unfinished
        if: steps.pipeline.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Chain only while there is work left AND this run moved it forward; a run that made no
          # progress (API down, every slice failing) ends the chain instead of looping.
          if python -c "import json,sys; s=json.load(open('data/cache/status.json')); sys.exit(0 if s.get('stopped_early') and s.get('progress_made') else 1)"; then
            echo "Backfill unfinished; starting the next run."
            gh workflow run refresh.yml --ref "${{ github.ref_name }}"
          else
            python -c "import json; s=json.load(open('data/cache/status.json')); print('Not chaining:', {k: s.get(k) for k in ('stopped_early','progress_made','missing_days')})"
          fi
